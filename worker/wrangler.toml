name = "museiq"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[vars]
PAGE_SIZE = "12"
AI_PROVIDER = "deepseek"
AI_MODEL_CHAT = "deepseek-chat"
AI_DAILY_CALL_CAP = "5000"
ANALYSIS_VERSION = "1"
DEFAULT_USER_ID = "chen"

# bundle the wiki schema doc as a string import in src/ai/prompts.ts
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# D1 — replace database_id after running `wrangler d1 create museum-db`
[[d1_databases]]
binding = "DB"
database_name = "museum-db"
database_id = "f0509306-a0cf-4bcb-9da0-95cbd99b2d74"
migrations_dir = "migrations"

# R2 — create with `wrangler r2 bucket create museum-media`
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "museum-media"

[observability]
enabled = true

# Cron trigger — every minute drain up to CRON_BATCH_SIZE pending/failed
# interactions through the AI ingest pipeline. Scheduled handlers get
# their own CPU budget independent of request handlers, so the backfill
# completes without fighting user traffic.
[triggers]
crons = ["* * * * *"]

[placement]
mode = "smart"
